[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-game-api"
version = "0.2.1"
description = "A unified, developer-friendly Python interface for public game data and statistics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "F0xyN0xy", email = "foxynoxy07@proton.me" }
]
keywords = ["games", "api", "gaming", "statistics", "chess", "python", "lichess", "osu", "esports", "leaderboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/F0xyN0xy/universal-game-api"
Repository = "https://github.com/F0xyN0xy/universal-game-api"
Documentation = "https://github.com/F0xyN0xy/universal-game-api#readme"
Issues = "https://github.com/F0xyN0xy/universal-game-api/issues"
"Bug Tracker" = "https://github.com/F0xyN0xy/universal-game-api/issues"
Changelog = "https://github.com/F0xyN0xy/universal-game-api/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gameapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that hit real APIs (slow, may fail due to network/rate limits)",
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py39"
