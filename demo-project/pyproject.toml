[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gameapi-demo"
version = "0.1.0"
description = "A demo CLI and dashboard built on top of gameapi."
requires-python = ">=3.9"
dependencies = [
    "gameapi",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
