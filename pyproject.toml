[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gameapi"
version = "0.1.0"
description = "A unified, developer-friendly Python interface for public game data and statistics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Universal Game API Contributors" }
]
keywords = ["games", "api", "gaming", "statistics", "chess", "rocket-league"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/example/gameapi"
Documentation = "https://github.com/example/gameapi#readme"
Issues = "https://github.com/example/gameapi/issues"
Changelog = "https://github.com/example/gameapi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gameapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py39"
